# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude Cowork - High Auto-Accept Ratio on High-Risk Tools (Signal)
enabled: Staging
description: |-
  ## Goal
  Signal version of the auto-accept ratio rule: a looser threshold that marks sessions leaning heavily on auto-approval of high-risk tools.

  ## Strategy
  Same query as the alert version, with the threshold lowered to at least 10 calls and more than 90% auto-accepted.

  ## Signal
  This is a **signal**, not an alert. It has Informational severity and no event sinks, so it never pages anyone by itself. It exists to feed the `Claude Cowork - Multi-Stage Agent Compromise (Critical Correlation)` rule. Its standalone alert sibling is `Claude Cowork - High Auto-Accept Ratio on High-Risk Tools`, which uses a stricter threshold.

  ## Values you must supply
  * The high-risk tool list, same as the alert version.

  ## Notes and limitations
  * Thresholds are starting points; keep them looser than the alert sibling's.
severity: Informational
query_text: |-
  log.attributes.event.name:tool_decision
  log.attributes.tool_name:(Bash or Write or Edit or NotebookEdit)
  log.attributes.decision:accept
  | eval is_auto = if(log.attributes.source == "config", 1, 0)
  | stats sum(is_auto) as auto_accepts, count() as total by log.attributes.user.id, log.attributes.session.id
  | eval auto_ratio = auto_accepts / total
  | where total >= 10 and auto_ratio > 0.90
  | rename(log.attributes.user.id as entity_user_id)
time_range_s: 3600
run_frequency_s: 3600
tags:
- source.claude_cowork
- signal
- correlation.composite_critical
- tactics.ta0002.execution
