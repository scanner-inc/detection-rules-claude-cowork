      {"timestamp":"2026-09-24T11:58:59.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"wget\",\"full_command\":\"wget https://x.example\",\"description\":\"Run command\"}","decision":"reject","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:58:58.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"nc\",\"full_command\":\"nc x.example 443\",\"description\":\"Run command\"}","decision":"reject","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
