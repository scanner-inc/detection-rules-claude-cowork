# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - Elevated Tool Rejection Rate
enabled: Staging
description: |-
  ## Goal
  Detect sessions where a large share of the tool calls Claude proposed were rejected.

  ## Strategy
  Computes the fraction of `tool_decision` events with `decision` = `reject` per user and session. Fires when a session has at least 10 decisions and more than 30% were rejected.

  ## Triage and response
  1. Decide which of three cases this is: the review layer correctly stopping risky proposals, a permission or policy misconfiguration causing mass rejections, or someone deliberately probing boundaries.
  2. Review the rejected calls' `tool_name` and `tool_parameters` to see what was being attempted.
  3. If the rejected actions look malicious, review the user's prompts and other sessions.

  ## Notes and limitations
  * A normal rejection rate depends on your permission policy. Tune the 30% and 10-decision thresholds per environment.
  * Fully autonomous sessions produce no rejections, so they cannot trigger this rule.
severity: Medium
query_text: |-
  log.attributes.event.name:tool_decision
  | eval is_reject = if(log.attributes.decision == "reject", 1, 0)
  | stats sum(is_reject) as rejects, count() as total by log.attributes.user.id, log.attributes.session.id
  | eval reject_ratio = rejects / total
  | where total >= 10 and reject_ratio > 0.30
time_range_s: 3600
run_frequency_s: 3600
event_sink_keys:
- medium_severity_alerts
tags:
- source.claude
- product.claude_cowork
- product.claude_code
- tactics.ta0007.discovery
