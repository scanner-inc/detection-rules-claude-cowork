# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude Cowork - Repeated Calls to Unapproved Domain
enabled: Staging
description: |-
  ## Goal
  Detect repeated outbound calls from shell commands to a domain that is not on your approved list, a possible command-and-control or exfiltration channel.

  ## Strategy
  Extracts the host from the first `http(s)://` URL in each Bash command, keeps hosts not on the approved list, and fires when one session calls the same unapproved host 10 or more times.

  ## Triage and response
  1. Identify the domain and who owns it.
  2. Look at what was sent or fetched.
  3. Block the domain if it is not legitimate.

  ## Values you must supply
  * Approved outbound domains. Replace `<approved-domain-1>|<approved-domain-2>` in the regex with your domains (escape dots, for example `github\.com|pypi\.org`). Until you do, every URL will count as unapproved.

  ## Notes and limitations
  * Bash only. WebFetch is not covered yet because its argument format has not been confirmed.
  * A volume proxy for beaconing: it cannot measure regular timing, and slow beaconing under the threshold is missed.
  * Only the first URL in a command is checked; bare IPs with ports and URLs without a scheme are missed.
severity: Medium
query_text: |-
  log.attributes.event.name:tool_decision
  log.attributes.tool_name:Bash
  | eval domain = coalesce(regex.extract(log.attributes.tool_parameters, /https?:\/\/([^\/"\\]+)/, 1), "")
  | eval is_unapproved = if(domain != "" and not regex.is_match(domain, /<approved-domain-1>|<approved-domain-2>/), 1, 0)
  | where is_unapproved = 1
  | stats count() as calls by log.attributes.user.id, log.attributes.session.id, domain
  | where calls >= 10
  | rename(log.attributes.user.id as entity_user_id)
time_range_s: 3600
run_frequency_s: 900
dedup_window_s: 3600
event_sink_keys:
- medium_severity_alerts
tags:
- source.claude_cowork
- tactics.ta0011.command_and_control
- techniques.t1071.application_layer_protocol
