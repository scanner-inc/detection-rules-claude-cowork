# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - Compliance API Accessed by Unapproved Actor
enabled: Staging
description: |-
  ## Before you enable
  * **Matches every Compliance API access until you replace `<approved-compliance-user-1>` and `<approved-compliance-user-2>`.**
  * Needs the Claude Compliance API activity feed ingested. Without it, this rule never fires.
  * The inline tests use the shipped placeholder values. When you replace them, update the test events too.

  ## Goal
  Detect the Claude Compliance API being used by someone outside the set of people and service identities expected to use it. The Compliance API can export session transcripts and other sensitive data.

  ## Strategy
  Matches `compliance_api_accessed` activity (logged for every Compliance API request) where the actor is not on the approved list.

  ## Triage and response
  1. Identify the actor and whether they have a reason to use the Compliance API.
  2. Check what else the actor did around the same time.
  3. If unauthorized, revoke the API key used.

  ## Values you should supply
  * Approved Compliance API users. Replace `<approved-compliance-user-1>` and `<approved-compliance-user-2>` with the emails of your security/compliance staff and audit automation. Until you do, every access will match.

  ## Notes and limitations
  * The activity feed does not record which endpoint was called, so this flags any Compliance API access by an unapproved actor, not specifically transcript exports.
severity: High
query_text: |-
  type:compliance_api_accessed
  not actor.email_address:("<approved-compliance-user-1>" or "<approved-compliance-user-2>")
  | stats count() as api_pulls by actor.email_address, actor.user_id
time_range_s: 3600
run_frequency_s: 3600
event_sink_keys:
- high_severity_alerts
tags:
- source.claude
- product.claude_cowork
- tactics.ta0009.collection
- techniques.t1213.data_from_information_repositories
tests:
  - name: "Compliance API access by an unapproved actor fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","id":"act-60","type":"compliance_api_accessed","created_at":"2026-09-24T11:59:00.000Z","actor":{"type":"user_actor","email_address":"mallory@example.com","user_id":"cu-1","ip_address":"203.0.113.10"}}
    expected_detection_result: true
  - name: "Compliance API access by an approved actor does not fire"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","id":"act-60","type":"compliance_api_accessed","created_at":"2026-09-24T11:59:00.000Z","actor":{"type":"user_actor","email_address":"<approved-compliance-user-1>","user_id":"cu-1","ip_address":"203.0.113.10"}}
    expected_detection_result: false
  - name: "Other activity by an unapproved actor does not fire"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","id":"act-60","type":"claude_chat_created","created_at":"2026-09-24T11:59:00.000Z","actor":{"type":"user_actor","email_address":"mallory@example.com","user_id":"cu-1","ip_address":"203.0.113.10"}}
    expected_detection_result: false
