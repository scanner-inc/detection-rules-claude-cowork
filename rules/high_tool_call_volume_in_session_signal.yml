# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - High Tool Call Volume in Session (Signal)
enabled: Staging
description: |-
  ## Goal
  Signal version of the high tool call volume rule.

  ## Strategy
  Same query as the alert version, with the threshold lowered to 50 tool calls per hour.

  ## Signal
  This is a **signal**, not an alert. It has Informational severity and no event sinks, so it never pages anyone by itself. It exists to feed the `Claude - Multi-Stage Agent Compromise (Critical Correlation)` rule. Its standalone alert sibling is `Claude - High Tool Call Volume in Session`, which uses a stricter threshold.
severity: Informational
query_text: |-
  log.attributes.event.name:tool_result
  | stats count() as tool_calls by log.attributes.user.id, log.attributes.session.id
  | where tool_calls >= 50
  | rename(log.attributes.user.id as entity_user_id)
time_range_s: 3600
run_frequency_s: 3600
tags:
- source.claude
- product.claude_cowork
- product.claude_code
- signal
- correlation.composite_critical
