# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude Cowork - Same Bash Command Repeated in Session
enabled: Staging
description: |-
  ## Goal
  Detect the same kind of shell command being run many times in one session, even when its arguments change each time (for example enrolling many devices or re-creating pods).

  ## Strategy
  Normalizes each Bash command to its first two words (for example `kubectl create`) with `regex.extract`, then counts repeats per session. Fires at 10 or more.

  ## Triage and response
  1. Look at the normalized command and a few of the full commands behind it.
  2. Decide whether this is a legitimate loop or fan-out (device enrollment, resource creation, persistence).
  3. Stop the session if the repetition is unexpected.

  ## Notes and limitations
  * Two different commands that share their first two words are grouped together. A single-word command (for example `id`) is grouped by that word.
  * The regex assumes the `"bash_command": "..."` JSON shape inside `tool_parameters`.
  * The 10-repeat threshold is a starting point.
severity: Medium
query_text: |-
  log.attributes.event.name:tool_decision
  log.attributes.tool_name:Bash
  | eval norm_cmd = coalesce(regex.extract(log.attributes.tool_parameters, /"bash_command":\s*"([^\s"]+(?:\s+[^\s"]+)?)/, 1), log.attributes.tool_parameters)
  | stats count() as reps by norm_cmd, log.attributes.session.id, log.attributes.user.id
  | where reps >= 10
  | rename(log.attributes.user.id as entity_user_id)
time_range_s: 3600
run_frequency_s: 900
dedup_window_s: 3600
event_sink_keys:
- medium_severity_alerts
tags:
- source.claude_cowork
- tactics.ta0003.persistence
