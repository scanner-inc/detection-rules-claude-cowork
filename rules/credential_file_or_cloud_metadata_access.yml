# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - Credential File or Cloud Metadata Access
enabled: Staging
description: |-
  ## Goal
  Detect Claude reading well-known credential files or querying the cloud instance metadata endpoint.

  ## Strategy
  Matches Bash `tool_decision` events whose command matches a regex of credential locations under any home directory or spelling (`~`, `$HOME`, `/home/<user>`, `/Users/<user>`, `/root`): AWS `.aws/credentials`, SSH private keys (`.ssh/id_*`, not `.pub`), `.kube/config`, Kubernetes `admin.conf` and service account tokens, and the metadata IPs (169.254.169.254, fd00:ec2::254). Uses `tool_decision` so rejected attempts are also caught.

  ## Triage and response
  1. Read the full command and whether it was accepted.
  2. If accepted, assume the credentials were exposed: rotate them.
  3. Review subsequent activity using those credentials.

  ## Values you should supply
  * Optional: extend the regex with other credential locations you care about (for example GCP key files, `.docker/config.json`, `.npmrc`, `.netrc`, `.env`). The shipped regex works without changes.

  ## Notes and limitations
  * Matches anywhere in the command text, so a command that only mentions a path (for example `ssh -i ~/.ssh/id_rsa host`) also fires.
severity: High
query_text: |-
  log.attributes.event.name:tool_decision
  log.attributes.tool_name:Bash
  | eval cmd = coalesce(regex.extract(log.attributes.tool_parameters, /^([\s\S]*)$/, 1), "")
  | eval is_cred = if(regex.is_match(cmd, /\.aws\/credentials|\.ssh\/id_[A-Za-z0-9_-]+([^.A-Za-z0-9_-]|$)|serviceaccount\/token|\.kube\/config|kubernetes\/admin\.conf|169\.254\.169\.254|fd00:ec2::254/), 1, 0)
  | where is_cred = 1
  | stats count() as credential_hits by log.attributes.user.id, log.attributes.session.id
  | rename(log.attributes.user.id as entity_user_id)
time_range_s: 3600
run_frequency_s: 900
dedup_window_s: 3600
event_sink_keys:
- high_severity_alerts
tags:
- source.claude
- product.claude_cowork
- product.claude_code
- correlation.composite_critical
- tactics.ta0006.credential_access
- techniques.t1552.unsecured_credentials
- techniques.t1552.005.cloud_instance_metadata_api
tests:
  - name: "Reading AWS credentials with a tilde path fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"cat\",\"full_command\":\"cat ~/.aws/credentials\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: true
  - name: "Reading another user's AWS credentials fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"cat\",\"full_command\":\"cat /home/alice/.aws/credentials\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: true
  - name: "Copying non-RSA SSH private keys fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"cp\",\"full_command\":\"cp /Users/bob/.ssh/id_ecdsa /tmp/k\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:58:50.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"cat\",\"full_command\":\"cat $HOME/.ssh/id_ed25519\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: true
  - name: "Querying the instance metadata endpoint fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"curl\",\"full_command\":\"curl -s http://169.254.169.254/latest/meta-data/iam/security-credentials/\",\"description\":\"Run command\"}","decision":"reject","source":"user_reject"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: true
  - name: "Reading a Kubernetes service account token fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"cat\",\"full_command\":\"cat /var/run/secrets/kubernetes.io/serviceaccount/token\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: true
  - name: "Public keys, AWS config and ordinary commands do not fire"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"cat\",\"full_command\":\"cat ~/.ssh/id_rsa.pub\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:58:50.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"cat\",\"full_command\":\"cat ~/.aws/config\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:58:40.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"ls\",\"full_command\":\"ls -la ~/projects\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: false
  - name: "Non-Bash tools are out of scope for this rule"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Read","tool_source":"builtin","decision":"accept","source":"config","tool_parameters":"{\"file_path\":\"/home/alice/.aws/credentials\"}"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: false
