# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - Credential File or Cloud Metadata Access
enabled: Staging
description: |-
  ## Goal
  Detect Claude reading well-known credential files or querying the cloud instance metadata endpoint.

  ## Strategy
  Matches Bash `tool_decision` events whose command references a known credential path or the metadata IP (169.254.169.254, fd00:ec2::254). Uses `tool_decision` so rejected attempts are also caught.

  ## Triage and response
  1. Read the full command and whether it was accepted.
  2. If accepted, assume the credentials were exposed: rotate them.
  3. Review subsequent activity using those credentials.

  ## Values you should supply
  * Optional: extend the path list with other credential locations you care about (for example GCP key files, `~/.docker/config.json`, `.npmrc`, `.netrc`, `.env`). The shipped list works without changes.

  ## Notes and limitations
  * Scanner's tokenizer splits IPs and paths on punctuation, so matching is on tokens rather than an exact literal string. Validate against your own data.
severity: High
query_text: |-
  log.attributes.event.name:tool_decision
  log.attributes.tool_name:Bash
  log.attributes.tool_parameters:("/var/run/secrets/kubernetes.io/serviceaccount/token" or "/root/.aws/credentials" or "~/.ssh/id_rsa" or "/etc/kubernetes/admin.conf" or "169.254.169.254" or "fd00:ec2::254")
  | stats count() as credential_hits by log.attributes.user.id, log.attributes.session.id
  | rename(log.attributes.user.id as entity_user_id)
time_range_s: 3600
run_frequency_s: 900
dedup_window_s: 3600
event_sink_keys:
- high_severity_alerts
tags:
- source.claude
- product.claude_cowork
- product.claude_code
- correlation.composite_critical
- tactics.ta0006.credential_access
- techniques.t1552.unsecured_credentials
