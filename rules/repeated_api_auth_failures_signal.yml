  - name: "Rate-limit errors are not auth failures"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.api_error","attributes":{"event.name":"api_error","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","status_code":"429","error":"error","attempt":"1"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:58:59.000Z","log":{"body":"claude_code.api_error","attributes":{"event.name":"api_error","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","status_code":"429","error":"error","attempt":"1"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:58:58.000Z","log":{"body":"claude_code.api_error","attributes":{"event.name":"api_error","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","status_code":"429","error":"error","attempt":"1"}},"resource":{"attributes":{"service.name":"claude-code"}}}
