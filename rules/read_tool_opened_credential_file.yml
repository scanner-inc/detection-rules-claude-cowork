# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - Read Tool Opened Credential File
enabled: Staging
description: |-
  ## Before you enable
  * Works as shipped. Reading `.env` files fires; if that is routine for your developers, remove `.env` from the regex.
  * Claude Code: set `OTEL_LOG_TOOL_DETAILS=1`, or this rule never fires on Claude Code events (commands and file paths are not logged without it).
  * The inline tests use the shipped defaults. If you change them, update the test events too.

  ## Goal
  Detect Claude's Read tool opening a well-known credential file, such as cloud provider credentials, `.env` files, SSH private keys or package registry tokens.

  ## Strategy
  Extracts `file_path` from the `tool_input` of Read `tool_result` events and matches it against a list of credential file locations. Complements `Claude - Credential File or Cloud Metadata Access`, which only looks at Bash commands.

  ## Triage and response
  1. Identify the file and whether the session's task had a reason to read it.
  2. Assume the contents reached the model context: rotate the credentials if the read was not expected.
  3. Check the rest of the session for any outbound request that could have carried the secret.

  ## Values you should supply
  * The credential path regex (AWS, `.env`, SSH private keys, `.netrc`, `.npmrc`, `.pypirc`, `.git-credentials`, `.pgpass`, Docker and kube configs, gcloud credentials, Kubernetes service account tokens). Add paths for your environment.

  ## Notes and limitations
  * In Claude Code, `tool_input` and `tool_parameters` are only logged when `OTEL_LOG_TOOL_DETAILS=1` is set. Without it this rule cannot fire.
  * Developers legitimately ask Claude to read `.env` files while debugging; exclude `.env` from the regex if that is common for you. Template files (`.env.example`, `.env.sample`, `.env.template`, `.env.dist`, `.env.defaults`) are already excluded.
  * Permission rules that deny Read on these paths are the better control; this rule tells you whether they are in place.
severity: High
query_text: |-
  log.attributes.event.name:tool_result
  log.attributes.tool_name:Read
  | eval path = coalesce(regex.extract(log.attributes.tool_input, /"file_path":\s*"([^"]*)"/, 1), "")
  | eval is_cred = if(regex.is_match(path, /\/\.aws\/(credentials|config)$|(^|\/)\.env(\.[^\/]*)?$|\/\.ssh\/id_[^\/]*$|\/\.netrc$|\/\.npmrc$|\/\.pypirc$|\/\.git-credentials$|\/\.pgpass$|\/\.docker\/config\.json$|\/\.kube\/config$|\/gcloud\/.*credentials[^\/]*$|\/serviceaccount\/token$/) and not regex.is_match(path, /(^|\/)\.env\.(example|sample|template|dist|defaults)$/), 1, 0)
  | where is_cred = 1
  | stats count() as reads by log.attributes.user.id, log.attributes.session.id, path
  | rename(log.attributes.user.id as entity_user_id)
time_range_s: 3600
run_frequency_s: 900
dedup_window_s: 3600
event_sink_keys:
- high_severity_alerts
tags:
- source.claude
- product.claude_code
- tactics.ta0006.credential_access
- techniques.t1552.001.credentials_in_files
tests:
  - name: "Reading a project .env file fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_result","attributes":{"event.name":"tool_result","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Read","success":"true","duration_ms":"42","tool_input":"{\"file_path\":\"/repo/.env\",\"content\":\"x\"}"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: true
  - name: "Reading environment-specific .env files fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_result","attributes":{"event.name":"tool_result","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Read","success":"true","duration_ms":"42","tool_input":"{\"file_path\":\"/repo/.env.production\",\"content\":\"x\"}"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: true
  - name: "Reading AWS credentials fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_result","attributes":{"event.name":"tool_result","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Read","success":"true","duration_ms":"42","tool_input":"{\"file_path\":\"/Users/bob/.aws/credentials\",\"content\":\"x\"}"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: true
  - name: "Reading .env templates does not fire"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_result","attributes":{"event.name":"tool_result","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Read","success":"true","duration_ms":"42","tool_input":"{\"file_path\":\"/repo/.env.example\",\"content\":\"x\"}"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:58:50.000Z","log":{"body":"claude_code.tool_result","attributes":{"event.name":"tool_result","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Read","success":"true","duration_ms":"42","tool_input":"{\"file_path\":\"/repo/.env.sample\",\"content\":\"x\"}"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:58:40.000Z","log":{"body":"claude_code.tool_result","attributes":{"event.name":"tool_result","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Read","success":"true","duration_ms":"42","tool_input":"{\"file_path\":\"/repo/.env.template\",\"content\":\"x\"}"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: false
  - name: "Reading ordinary source files does not fire"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_result","attributes":{"event.name":"tool_result","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Read","success":"true","duration_ms":"42","tool_input":"{\"file_path\":\"/repo/src/env.ts\",\"content\":\"x\"}"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:58:50.000Z","log":{"body":"claude_code.tool_result","attributes":{"event.name":"tool_result","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Read","success":"true","duration_ms":"42","tool_input":"{\"file_path\":\"/repo/README.md\",\"content\":\"x\"}"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: false
