      {"timestamp":"2026-09-24T11:59:05.000Z","log":{"body":"claude_code.tool_result","attributes":{"event.name":"tool_result","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"curl\",\"full_command\":\"curl -s https://ifconfig.me\",\"description\":\"Run command\"}","success":"true","tool_input":"{\"command\":\"curl -s https://ifconfig.me\",\"description\":\"Run command\"}"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: true
