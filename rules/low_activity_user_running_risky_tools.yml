# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - Low-Activity User Running Risky Tools
enabled: Staging
description: |-
  ## Before you enable
  * **Tune this rule for your environment before switching it to `Active`.** It looks for users with very little Claude activity over the last 24 hours who still ran a risky tool. What counts as "very little" depends on how your people use Claude: in an organization where many people use Claude only occasionally, the shipped threshold (5 or fewer tool calls in 24 hours) fires on normal light use. Watch it in Staging, then raise or lower the threshold, extend the lookback (for example to 7 days, `time_range_s: 604800`, if your query volume allows), or exclude known light users.
  * The inline tests use the shipped threshold and lookback. If you change them, update the test events too.

  ## Goal
  Detect a user who does almost nothing in a day except run a risky tool, a pattern consistent with stolen or leaked credentials being used directly.

  ## Strategy
  Per user, counts tool calls (`tool_decision` events, one per call) over the last 24 hours, and the Bash/Write ones among them. Fires when a user made 5 or fewer tool calls in those 24 hours and at least one was risky. Checked hourly; re-alerts at most once a day per user.

  ## Triage and response
  1. Check whether the user is new, or has been inactive for a long time.
  2. Review exactly what the risky command did.
  3. Confirm with the user; if they did not do it, revoke their credentials.

  ## Notes and limitations
  * This is a volume proxy. It does not prove the risky call came first or that no ramp-up happened, only that total activity was very low.
  * Evaluated across all of the user's sessions in the window combined.
  * The 5-call threshold and 24-hour lookback are starting points; see "Before you enable".
severity: Medium
query_text: |-
  log.attributes.event.name:tool_decision
  | eval is_risky = if(log.attributes.tool_name == "Bash" or log.attributes.tool_name == "Write", 1, 0)
  | stats count() as total_tool_calls, sum(is_risky) as risky_events by log.attributes.user.id
  | where total_tool_calls <= 5 and risky_events >= 1
time_range_s: 86400
run_frequency_s: 3600
dedup_window_s: 86400
event_sink_keys:
- medium_severity_alerts
tags:
- source.claude
- product.claude_cowork
- product.claude_code
- tactics.ta0001.initial_access
- techniques.t1078.valid_accounts
