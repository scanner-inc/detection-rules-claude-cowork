# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - Human Reviewer Approving Everything (Signal)
enabled: Staging
description: |-
  ## Goal
  Signal version of the rubber-stamp review rule.

  ## Strategy
  Same query as the alert version, with the threshold lowered to at least 10 human decisions and fewer than 10% rejected.

  ## Signal
  This is a **signal**, not an alert. It has Informational severity and no event sinks, so it never pages anyone by itself. It exists to feed the `Claude - Multi-Stage Agent Compromise (Critical Correlation)` rule. Its standalone alert sibling is `Claude - Human Reviewer Approving Everything`, which uses a stricter threshold.

  ## Values you should supply
  * The high-risk tool list, same as the alert version.
severity: Informational
query_text: |-
  log.attributes.event.name:tool_decision
  log.attributes.tool_name:(Bash or Write or Edit or NotebookEdit)
  not log.attributes.source:"config"
  | eval is_reject = if(log.attributes.decision == "reject", 1, 0)
  | stats sum(is_reject) as rejects, count() as total by log.attributes.user.id, log.attributes.session.id
  | eval reject_ratio = rejects / total
  | where total >= 10 and reject_ratio < 0.10
  | rename(log.attributes.user.id as entity_user_id)
time_range_s: 3600
run_frequency_s: 3600
tags:
- source.claude
- product.claude_cowork
- product.claude_code
- signal
- correlation.composite_critical
- tactics.ta0005.defense_evasion
