# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - Role Change with Risky Tool Use (Correlation)
enabled: Staging
description: |-
  ## Before you enable
  * **Never fires until you replace `00000000-0000-0000-0000-000000000000`** in the first line of the query with your `_detections` index ID (see "Values you should supply").
  * It only fires if its contributing rules are enabled. Fill in their placeholders first: a contributor left unfilled matches everything and makes this correlation fire far more often.
  * Needs the Claude Compliance API activity feed ingested.

  ## Goal
  Detect a role or permission change followed, in the same hour, by high-risk tool use from the same person.

  ## Strategy
  Queries `_detections` for alerts tagged `correlation.role_change_risky_tool` and fires when both signal rules hit the same `entity_email`.

  ## Triage and response
  1. Identify who made the role change and whether it was approved.
  2. Review the high-risk activity that followed.
  3. Revert unapproved role changes and review the account.

  ## Values you should supply
  * Your `_detections` index ID. Scanner requires rule files to name an index by ID, and the ID is different in every Scanner tenant. Replace `00000000-0000-0000-0000-000000000000` in the first line of the query with your own: in the Scanner search box, type `@index=_detections` and tab-complete it to get the full `{ ID | "_detections" }` specifier, or run `@index=_detections | head 1 | table(@index_id)`.

  ## Notes and limitations
  * Assumes the Compliance API's `actor.email_address` and the Claude telemetry's `user.email` refer to the same person. Confirm this once both sources are indexed.
  * Co-occurrence within the hour, not strict ordering. Check `detected_in_time_range` on each contributing alert to see the order.
severity: High
query_text: |-
  @index={ 00000000-0000-0000-0000-000000000000 | "_detections" }
  tags[*]:correlation.role_change_risky_tool
  | stats countdistinct(name) as rule_count by results_table.rows[0].entity_email
  | where rule_count >= 2
time_range_s: 3600
run_frequency_s: 3600
event_sink_keys:
- high_severity_alerts
tags:
- source.claude
- product.claude_cowork
- correlation
- tactics.ta0004.privilege_escalation
tests:
  - name: "Both signals for the same person fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","name":"Claude - Role or Permission Change (Signal)","severity":"Informational","tags":["correlation.role_change_risky_tool"],"detected_in_time_range":{"start":"2026-09-24T10:59:00.000Z","end":"2026-09-24T11:59:00.000Z"},"results_table":{"rows":[{"entity_email":"alice@example.com"}]}}
      {"timestamp":"2026-09-24T11:45:00.000Z","name":"Claude - Accepted High-Risk Tool Calls (Signal)","severity":"Informational","tags":["correlation.role_change_risky_tool"],"detected_in_time_range":{"start":"2026-09-24T10:45:00.000Z","end":"2026-09-24T11:45:00.000Z"},"results_table":{"rows":[{"entity_email":"alice@example.com"}]}}
    expected_detection_result: true
  - name: "Only one of the two signals does not fire"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","name":"Claude - Accepted High-Risk Tool Calls (Signal)","severity":"Informational","tags":["correlation.role_change_risky_tool"],"detected_in_time_range":{"start":"2026-09-24T10:59:00.000Z","end":"2026-09-24T11:59:00.000Z"},"results_table":{"rows":[{"entity_email":"alice@example.com"}]}}
      {"timestamp":"2026-09-24T11:45:00.000Z","name":"Claude - Accepted High-Risk Tool Calls (Signal)","severity":"Informational","tags":["correlation.role_change_risky_tool"],"detected_in_time_range":{"start":"2026-09-24T10:45:00.000Z","end":"2026-09-24T11:45:00.000Z"},"results_table":{"rows":[{"entity_email":"alice@example.com"}]}}
    expected_detection_result: false
  - name: "The two signals for different people do not fire"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","name":"Claude - Role or Permission Change (Signal)","severity":"Informational","tags":["correlation.role_change_risky_tool"],"detected_in_time_range":{"start":"2026-09-24T10:59:00.000Z","end":"2026-09-24T11:59:00.000Z"},"results_table":{"rows":[{"entity_email":"alice@example.com"}]}}
      {"timestamp":"2026-09-24T11:45:00.000Z","name":"Claude - Accepted High-Risk Tool Calls (Signal)","severity":"Informational","tags":["correlation.role_change_risky_tool"],"detected_in_time_range":{"start":"2026-09-24T10:45:00.000Z","end":"2026-09-24T11:45:00.000Z"},"results_table":{"rows":[{"entity_email":"bob@example.com"}]}}
    expected_detection_result: false
