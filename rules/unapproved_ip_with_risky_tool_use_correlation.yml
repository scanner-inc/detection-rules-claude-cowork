      {"timestamp":"2026-09-24T11:45:00.000Z","name":"Claude - Accepted High-Risk Tool Calls (Signal)","severity":"Informational","tags":["correlation.new_ip_risky_tool"],"detected_in_time_range":{"start":"2026-09-24T10:45:00.000Z","end":"2026-09-24T11:45:00.000Z"},"results_table":{"rows":[{"entity_email":"alice@example.com"}]}}
