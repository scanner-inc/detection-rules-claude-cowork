# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude Cowork - Unapproved IP with Risky Tool Use (Correlation)
enabled: Staging
description: |-
  ## Goal
  Detect a user who is active from an unapproved IP and, in the same hour, has high-risk tool calls accepted.

  ## Strategy
  Queries the `_detections` index for alerts tagged `correlation.new_ip_risky_tool` and fires when both signal rules hit the same `entity_email`. No join is needed: each signal writes its alert to `_detections`, and this rule counts distinct rule names per person.

  ## Triage and response
  1. Confirm the IP's owner and location.
  2. Review the high-risk commands and file changes made in that hour.
  3. If the IP is not the user's, treat the account as compromised: revoke sessions and credentials.

  ## Values you must supply
  * Inherits the approved IP list from `Claude Cowork - Compliance API Activity from Unapproved IP (Signal)`.

  ## Notes and limitations
  * Assumes the Compliance API's `actor.email_address` and the Cowork telemetry's `user.email` refer to the same person. Confirm this once both sources are indexed.
  * Both signals must keep their `rename(... as entity_email)` line, or the correlation silently stops matching.
  * Co-occurrence within the hour, not strict ordering.
severity: High
query_text: |-
  @index=_detections
  tags[*]:correlation.new_ip_risky_tool
  | stats countdistinct(name) as rule_count by results_table.rows[0].entity_email
  | where rule_count >= 2
time_range_s: 3600
run_frequency_s: 3600
event_sink_keys:
- high_severity_alerts
tags:
- source.claude_cowork
- correlation
- tactics.ta0001.initial_access
