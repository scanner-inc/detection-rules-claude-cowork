# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude Cowork - Repeated Tool Execution Failures (Signal)
enabled: Staging
description: |-
  ## Goal
  Signal version of the repeated tool failure rule.

  ## Strategy
  Same query as the alert version, with the threshold lowered to 3 failures of the same tool.

  ## Signal
  This is a **signal**, not an alert. It has Informational severity and no event sinks, so it never pages anyone by itself. It exists to feed the `Claude Cowork - Multi-Stage Agent Compromise (Critical Correlation)` rule. Its standalone alert sibling is `Claude Cowork - Repeated Tool Execution Failures`, which uses a stricter threshold.
severity: Informational
query_text: |-
  log.attributes.event.name:tool_result
  log.attributes.success:"false"
  | stats count() as failures by log.attributes.tool_name, log.attributes.session.id, log.attributes.user.id
  | where failures >= 3
  | rename(log.attributes.user.id as entity_user_id)
time_range_s: 3600
run_frequency_s: 3600
tags:
- source.claude_cowork
- signal
- correlation.composite_critical
- tactics.ta0007.discovery
