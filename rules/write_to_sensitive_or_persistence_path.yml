      {"timestamp":"2026-09-24T11:59:00.000Z","log":{"body":"claude_code.tool_result","attributes":{"event.name":"tool_result","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","tool_name":"Write","success":"true","duration_ms":"42","tool_input":"{\"file_path\":\"/repo/src/cron_jobs/handler.ts\",\"content\":\"x\"}"}},"resource":{"attributes":{"service.name":"claude-code"}}}
