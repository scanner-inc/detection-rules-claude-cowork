      {"timestamp":"2026-09-24T11:58:59.000Z","log":{"body":"claude_code.user_prompt","attributes":{"event.name":"user_prompt","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-1","terminal.type":"vscode","organization.id":"org-example","prompt_length":"20"}},"resource":{"attributes":{"service.name":"claude-code"}}}
      {"timestamp":"2026-09-24T11:58:58.000Z","log":{"body":"claude_code.user_prompt","attributes":{"event.name":"user_prompt","user.id":"u-7f3a1c","user.email":"alice@example.com","session.id":"sess-2","terminal.type":"vscode","organization.id":"org-example","prompt_length":"20"}},"resource":{"attributes":{"service.name":"claude-code"}}}
