# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - User Active Across Many Sessions (Signal)
enabled: Staging
description: |-
  ## Goal
  Signal version of the many-sessions rule.

  ## Strategy
  Same query as the alert version, with the threshold lowered to 3 distinct sessions.

  ## Signal
  This is a **signal**, not an alert. It has Informational severity and no event sinks, so it never pages anyone by itself. It exists to feed the `Claude - Multi-Stage Agent Compromise (Critical Correlation)` rule. Its standalone alert sibling is `Claude - User Active Across Many Sessions`, which uses a stricter threshold.
severity: Informational
query_text: |-
  log.attributes.event.name:*
  | stats countdistinct(log.attributes.session.id) as distinct_sessions, countdistinct(log.attributes.terminal.type) as distinct_terminals by log.attributes.user.id
  | where distinct_sessions >= 3
  | rename(log.attributes.user.id as entity_user_id)
time_range_s: 3600
run_frequency_s: 3600
tags:
- source.claude
- product.claude_cowork
- product.claude_code
- signal
- correlation.composite_critical
tests:
