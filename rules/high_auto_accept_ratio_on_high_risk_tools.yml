# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - High Auto-Accept Ratio on High-Risk Tools
enabled: Staging
description: |-
  ## Goal
  Detect sessions where almost every high-risk tool call (shell commands, file writes and edits) was approved automatically by configuration rather than by a person.

  ## Strategy
  Counts accepted `tool_decision` events for high-risk tools per user and session, and computes the share whose decision `source` is `config` (auto-accepted). Fires when a session has at least 20 such calls and more than 95% were auto-accepted.

  ## Triage and response
  1. Check whether this user or session is expected to run unattended (CI, batch jobs, a deliberately autonomous agent). If so, add the identity to your exclusions.
  2. Review the Bash commands and file writes the session ran (`tool_parameters`) for anything unexpected.
  3. If nobody expected an autonomous run, confirm with the user and review how the session's permission settings were configured.

  ## Values you should supply
  * The high-risk tool list (`Bash`, `Write`, `Edit`, `NotebookEdit`). Review it against the tools your Claude deployment exposes. New tools ship over time.

  ## Notes and limitations
  * Assumes interactive, human-reviewed usage is the norm. In environments that intentionally run fully autonomous agents this will fire by design; exclude those identities.
  * Thresholds (20 calls, 95%) are starting points. Tune them on your own data.
severity: Medium
query_text: |-
  log.attributes.event.name:tool_decision
  log.attributes.tool_name:(Bash or Write or Edit or NotebookEdit)
  log.attributes.decision:accept
  | eval is_auto = if(log.attributes.source == "config", 1, 0)
  | stats sum(is_auto) as auto_accepts, count() as total by log.attributes.user.id, log.attributes.session.id
  | eval auto_ratio = auto_accepts / total
  | where total >= 20 and auto_ratio > 0.95
  | rename(log.attributes.user.id as entity_user_id)
time_range_s: 3600
run_frequency_s: 3600
event_sink_keys:
- medium_severity_alerts
tags:
- source.claude
- product.claude_cowork
- product.claude_code
- correlation.agent_off_rails
- tactics.ta0002.execution
