# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - Repeated Calls to Unapproved Domain (Signal)
enabled: Paused
description: |-
  ## Before you enable
  * **Ships `Paused`.** **Every URL counts as unapproved until you replace `<approved-domain-1>|<approved-domain-2>`**, so any session that calls the same host 5 times fires. It feeds the composite correlation. Switch it to `Staging` or `Active` only after you fill these in.
  * Claude Code: set `OTEL_LOG_TOOL_DETAILS=1`, or this rule never fires on Claude Code events (commands and file paths are not logged without it).
  * The inline tests use the shipped placeholder values. When you replace them, update the test events too.

  ## Goal
  Signal version of the unapproved domain rule.

  ## Strategy
  Same query as the alert version, with the threshold lowered to 5 calls.

  ## Signal
  This is a **signal**, not an alert. It has Informational severity and no event sinks, so it never pages anyone by itself. It exists to feed the `Claude - Multi-Stage Agent Compromise (Critical Correlation)` rule. Its standalone alert sibling is `Claude - Repeated Calls to Unapproved Domain`, which uses a stricter threshold.

  ## Values you should supply
  * Approved outbound domains, same as the alert version.
severity: Informational
query_text: |-
  log.attributes.event.name:tool_decision
  log.attributes.tool_name:Bash
  | eval domain = coalesce(regex.extract(log.attributes.tool_parameters, /https?:\/\/([^\/"\\]+)/, 1), "")
  | eval is_unapproved = if(domain != "" and not regex.is_match(domain, /<approved-domain-1>|<approved-domain-2>/), 1, 0)
  | where is_unapproved = 1
  | stats count() as calls by log.attributes.user.id, log.attributes.session.id, domain
  | where calls >= 5
  | rename(log.attributes.user.id as entity_user_id)
time_range_s: 3600
run_frequency_s: 900
dedup_window_s: 3600
tags:
- source.claude
- product.claude_cowork
- product.claude_code
- signal
- correlation.composite_critical
