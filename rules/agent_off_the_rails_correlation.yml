# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - Agent Off the Rails (Correlation)
enabled: Staging
description: |-
  ## Before you enable
  * **Never fires until you replace `00000000-0000-0000-0000-000000000000`** in the first line of the query with your `_detections` index ID (see "Values you should supply").
  * It only fires if its contributing rules are enabled. `Claude - Tool Call from Unapproved MCP Server` ships `Paused`; switch it on once its approved server list is filled in.

  ## Goal
  Detect two or more agent-misbehavior alerts firing for the same user within two hours.

  ## Strategy
  Queries `_detections` for alerts tagged `correlation.agent_off_rails`, which are raised by four standalone alerts: `Claude - High Auto-Accept Ratio on High-Risk Tools`, `Claude - Repeated Tool Execution Failures`, `Claude - Tool Call from Unapproved MCP Server` and `Claude - Repeated API Auth Failures (401/403)`. Fires when 2 or more distinct rules hit the same `entity_user_id`. Looks back 2 hours and runs hourly, so a pair that straddles an hour boundary (for example 10:55 and 11:05) is still caught; the 2-hour dedup window stops the same pair alerting twice.

  ## Triage and response
  1. Review the contributing alerts together.
  2. Decide whether one session or several independent sessions are involved.
  3. If the agent is acting outside its task, stop the session and review its prompts.

  ## Values you should supply
  * Your `_detections` index ID. Scanner requires rule files to name an index by ID, and the ID is different in every Scanner tenant. Replace `00000000-0000-0000-0000-000000000000` in the first line of the query with your own: in the Scanner search box, type `@index=_detections` and tab-complete it to get the full `{ ID | "_detections" }` specifier, or run `@index=_detections | head 1 | table(@index_id)`.

  ## Notes and limitations
  * Groups by user, not session, so two unrelated sessions can combine.
  * Checks co-occurrence within two hours, not a tight 10-minute window.
  * Consider raising the threshold to 3 once you see how often pairs co-fire benignly.
severity: High
query_text: |-
  @index={ 00000000-0000-0000-0000-000000000000 | "_detections" }
  tags[*]:correlation.agent_off_rails
  | stats countdistinct(name) as rule_count by results_table.rows[0].entity_user_id
  | where rule_count >= 2
time_range_s: 7200
run_frequency_s: 3600
dedup_window_s: 7200
event_sink_keys:
- high_severity_alerts
tags:
- source.claude
- product.claude_cowork
- product.claude_code
- correlation
- tactics.ta0002.execution
