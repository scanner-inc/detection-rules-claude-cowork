      {"timestamp":"2026-09-24T11:50:00.000Z","name":"Claude - Tool Call from Unapproved MCP Server","severity":"High","tags":["correlation.agent_off_rails"],"detected_in_time_range":{"start":"2026-09-24T10:50:00.000Z","end":"2026-09-24T11:50:00.000Z"},"results_table":{"rows":[{"entity_user_id":"u-7f3a1c"}]}}
