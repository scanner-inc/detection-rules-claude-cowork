# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Claude - Role or Permission Change (Signal)
enabled: Staging
description: |-
  ## Before you enable
  * Needs the Claude Compliance API activity feed ingested. Without it, this rule never fires. `Claude - Role Change with Risky Tool Use (Correlation)` then never fires either.

  ## Goal
  Signal: a role or permission change for a user in the Claude Compliance API activity feed.

  ## Strategy
  Matches role and RBAC activity types, grouped by actor and renamed to `entity_email`.

  ## Signal
  This is a **signal**, not an alert. It has Informational severity and no event sinks, so it never pages anyone by itself. It exists to feed `Claude - Role Change with Risky Tool Use (Correlation)`.

  ## Notes and limitations
  * Reads the Claude Compliance API activity feed. The activity `type` values are documented; other fields such as the old and new role are not, so the alert shows that a role changed and who changed it, not what changed.
severity: Informational
query_text: |-
  type:("claude_user_role_updated" or "rbac_role_assigned" or "rbac_role_created" or "rbac_role_deleted" or "rbac_role_permission_added" or "rbac_role_permission_removed" or "rbac_role_unassigned" or "rbac_role_updated" or "rbac_role_grant_updated")
  | stats count() as role_changes by actor.email_address, actor.user_id
  | rename(actor.email_address as entity_email)
time_range_s: 3600
run_frequency_s: 3600
alert_per_row: true
tags:
- source.claude
- product.claude_cowork
- signal
- correlation.role_change_risky_tool
tests:
  - name: "RBAC role assignment fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","id":"act-60","type":"rbac_role_assigned","created_at":"2026-09-24T11:59:00.000Z","actor":{"type":"user_actor","email_address":"admin@example.com","user_id":"cu-1","ip_address":"203.0.113.10"}}
    expected_detection_result: true
  - name: "User role update fires"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","id":"act-60","type":"claude_user_role_updated","created_at":"2026-09-24T11:59:00.000Z","actor":{"type":"user_actor","email_address":"admin@example.com","user_id":"cu-1","ip_address":"203.0.113.10"}}
    expected_detection_result: true
  - name: "Other activity types do not fire"
    now_timestamp: "2026-09-24T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-09-24T11:59:00.000Z","id":"act-60","type":"claude_chat_created","created_at":"2026-09-24T11:59:00.000Z","actor":{"type":"user_actor","email_address":"alice@example.com","user_id":"cu-1","ip_address":"203.0.113.10"}}
      {"timestamp":"2026-09-24T11:58:30.000Z","id":"act-90","type":"compliance_api_accessed","created_at":"2026-09-24T11:58:30.000Z","actor":{"type":"user_actor","email_address":"alice@example.com","user_id":"cu-1","ip_address":"203.0.113.10"}}
    expected_detection_result: false
